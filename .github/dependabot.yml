version: 2
updates:
  # Production dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    reviewers:
      - 'kian'
    assignees:
      - 'kian'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      # Group minor and patch updates for UI/styling packages
      ui-minor-patch:
        patterns:
          - '@radix-ui/*'
          - 'lucide-react'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'class-variance-authority'
          - 'clsx'
        update-types:
          - 'minor'
          - 'patch'
      # Group all Prisma-related updates together
      prisma:
        patterns:
          - '@prisma/*'
          - 'prisma'
        update-types:
          - 'minor'
          - 'patch'
      # Group type definition updates
      types:
        patterns:
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
      # Group development dependencies
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    reviewers:
      - 'kian'
    assignees:
      - 'kian'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      # Group all GitHub Actions updates together
      actions:
        patterns:
          - '*'
