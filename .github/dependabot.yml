version: 2
updates:
  # Production dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
    open-pull-requests-limit: 5
    reviewers:
      - 'kian'
    assignees:
      - 'kian'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    # Ignore pre-release versions and major updates
    ignore:
      # Ignore all pre-release versions (alpha, beta, rc, canary, next, etc.)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Specifically ignore beta versions of common packages
      - dependency-name: 'next-auth'
        versions: ['*-beta*', '*-alpha*', '*-rc*', '*-canary*']
      - dependency-name: 'next'
        versions: ['*-canary*', '*-rc*']
      # Ignore eslint-config-next major bumps (often requires config changes)
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
    groups:
      # Group all production dependencies (minor + patch only)
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'next-auth'
      # Group UI/styling packages
      ui:
        patterns:
          - '@radix-ui/*'
          - 'lucide-react'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'class-variance-authority'
          - 'clsx'
        update-types:
          - 'minor'
          - 'patch'
      # Group Prisma-related updates
      prisma:
        patterns:
          - '@prisma/*'
          - 'prisma'
        update-types:
          - 'minor'
          - 'patch'
      # Group type definitions
      types:
        patterns:
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
      # Group all dev dependencies
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions - update less frequently
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    reviewers:
      - 'kian'
    assignees:
      - 'kian'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      # Group all GitHub Actions updates together
      actions:
        patterns:
          - '*'
