name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      KK_LOCAL_DB_PORT: '55432'
      KK_TEST_DATABASE_URL: postgresql://user:pass@127.0.0.1:55432/kiarakraft_test
      KK_APP_PORT: '3000'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kiarakraft_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
        options: >-
          --health-cmd "pg_isready -U user -d kiarakraft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 55432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare isolated test database and synthetic fixtures
        run: npm run db:test:prepare

      - name: Verify formatting, types, lint, unit tests, translations, and policies
        run: npm run verify

      - name: Run guarded database integration tests
        run: npm run test:integration

      - name: Build with local-only service configuration
        run: npm run build:local

      - name: Start local application and verify bilingual pages
        env:
          NEXT_URL: http://127.0.0.1:3000
        shell: bash
        run: |
          set -euo pipefail
          npm run start:local > "$RUNNER_TEMP/kiarakraft-local-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::The isolated local application exited before becoming ready."
              exit 1
            fi
            if curl --fail --silent --max-time 2 --output /dev/null "$NEXT_URL/api/health"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::The isolated local application did not become ready within 60 attempts."
            exit 1
          fi
          npm run test:i18n
          npm run test:application
          npm run test:password-security

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
