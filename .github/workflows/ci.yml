---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./kiarakraft
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and cache dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./kiarakraft/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build application for CI
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          DIRECT_URL: postgresql://user:pass@localhost:5432/test
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: kiarakraft.com
          CI: 'true'

      - name: Run status checks against production
        run: npm run check:status
        env:
          BASE_URL: https://www.kiarakraft.com

      - name: Check for SSR placeholder leaks
        run: |
          if grep -R "Loading..." .next/server/ --include='*.html'; then
            echo "Error: Found 'Loading...' in server-rendered HTML." >&2
            exit 1
          fi
