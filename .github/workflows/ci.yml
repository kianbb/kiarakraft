---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kiarakraft
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kiarakraft/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
        env:
          # Minimal env to allow build that may reference these
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          DIRECT_URL: postgresql://user:pass@localhost:5432/test
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: kiarakraft.com

      - run: npm run check:status
        env:
          BASE_URL: https://www.kiarakraft.com
        name: Status checks (expect 200 and 404)

      - name: Fail if literal Loading... appears in server-rendered HTML
        run: |
          # Search only server-rendered HTML to avoid false positives from client JS
          if grep -R -n --include='*.html' "Loading..." .next/server/; then
            echo "Found 'Loading...' in server HTML. SSR/UI placeholders leaked." >&2
            exit 1
          fi
