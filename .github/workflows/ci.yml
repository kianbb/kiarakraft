---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          DIRECT_URL: postgresql://user:pass@localhost:5432/test

      - name: Security audit
        run: |
          echo "🔍 Auditing production dependencies (strict)..."
          npm audit --audit-level=high --omit=dev
          echo "🔍 Auditing dev dependencies (advisory)..."
          npm audit --audit-level=high --omit=prod || echo "⚠️ Dev dependency vulnerabilities found - documented for review"
        continue-on-error: false

      - name: Check code formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          DIRECT_URL: postgresql://user:pass@localhost:5432/test

      - name: Run i18n smoke tests
        run: npm run test:i18n

      - name: Verify i18n completeness
        run: npm run verify:i18n

      - name: Run typecheck
        run: npm run typecheck

      - name: Build application for CI
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          DIRECT_URL: postgresql://user:pass@localhost:5432/test
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: kiarakraft.com
          CI: 'true'

      - name: Wait for Vercel preview deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: waitForVercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

      - name: Run status checks against preview deployment
        run: npm run check:status
        env:
          VERCEL_URL: ${{ steps.waitForVercel.outputs.url }}

      - name: Check analytics integration
        run: npm run check:analytics

      - name: Check for SSR placeholder leaks
        run: npm run check:ssr

      - name: Run search smoke tests
        run: npm run search:smoke
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          DIRECT_URL: postgresql://user:pass@localhost:5432/test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
