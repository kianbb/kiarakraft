name: Lighthouse CI

on:
  push:
    branches:
      - main
      - chore/deps-2025-08-safe
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./kiarakraft

      - name: Build application
        run: npm run build
        working-directory: ./kiarakraft
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test?sslmode=disable
          DIRECT_URL: postgresql://user:pass@localhost:5432/test?sslmode=disable
          NEXTAUTH_SECRET: test-secret-key
          NEXTAUTH_URL: http://localhost:3000

      - name: Run Lighthouse CI
        run: npx -y @lhci/cli@0.13.0 autorun --config=.lighthouserc.json
        working-directory: ./kiarakraft
        timeout-minutes: 10
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test?sslmode=disable
          DIRECT_URL: postgresql://user:pass@localhost:5432/test?sslmode=disable
          NEXTAUTH_SECRET: test-secret-key
          NEXTAUTH_URL: http://localhost:3000