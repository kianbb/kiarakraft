name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security audit daily at 9 AM UTC
    - cron: '0 9 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (production only)
        run: |
          npm audit --production --audit-level=low || exit_code=$?
          if [ "${exit_code:-0}" -gt 0 ]; then
            echo "::error::Production vulnerabilities found!"
            exit $exit_code
          fi

      - name: Run npm audit (including dev)
        run: |
          npm audit --audit-level=moderate || exit_code=$?
          if [ "${exit_code:-0}" -gt 0 ]; then
            echo "::warning::Development dependency vulnerabilities found (non-blocking)"
          fi
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
